# Project-wide package ignores are intentionally avoided here.
# OSV scans supported lockfiles such as gradle/verification-metadata.xml; add
# package-specific [[PackageOverrides]] or [[IgnoredVulns]] entries only for
# verified false positives.

[[PackageOverrides]]
name = "com.fasterxml.jackson.core:jackson-databind"
version = "2.21.3"
ecosystem = "Maven"
vulnerability.ignore = true
reason = "Build-tool-only dependency from the OWASP Dependency-Check Gradle plugin; app runtime classpaths do not contain it."

[[PackageOverrides]]
name = "ch.qos.logback:logback-core"
version = "1.3.14"
ecosystem = "Maven"
vulnerability.ignore = true
reason = "Build-tool-only dependency from Gradle verification metadata; app runtime dependencies are checked separately."

[[PackageOverrides]]
name = "io[.]netty:netty-(codec|codec-http|codec-http2|common|handler|handler-proxy)"
nameIsRegex = true
version = "4.1.110.Final"
ecosystem = "Maven"
vulnerability.ignore = true
reason = "Build-tool-only dependency from Gradle verification metadata; app runtime dependencies are checked separately."

