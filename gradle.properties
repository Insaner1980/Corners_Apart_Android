org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=2
# Settings-pluginien versioita ei voi lukea suoraan libs.versions.toml-aliasina.
foojayResolverConventionVersion=1.0.0
# Haavoittuvien transitiivisten build-työkalujen keskitetyt korvausversiot.
buildToolSecurityOverrides=com.fasterxml.jackson.core:jackson-core:2.21.5,org.bouncycastle:bcpkix-jdk18on:1.84,org.bouncycastle:bcprov-jdk18on:1.84,org.bouncycastle:bcutil-jdk18on:1.84,org.bitbucket.b_c:jose4j:0.9.6,org.jdom:jdom2:2.0.6.1
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
