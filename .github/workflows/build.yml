name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3

      - name: Build debug APK
        run: ./gradlew --no-configuration-cache assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-configuration-cache test

      - name: Run detekt
        run: ./gradlew --no-configuration-cache :app:detekt

      - name: Run lint
        run: ./gradlew --no-configuration-cache lint
