name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew --no-configuration-cache assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-configuration-cache test

      - name: Run detekt
        run: ./gradlew --no-configuration-cache :app:detekt

      - name: Run lint
        run: ./gradlew --no-configuration-cache lint
