name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          # Kotlin 2.4 ei ole viela CodeQL:n tuetussa Kotlin-versiorajassa.
          # Skannaa siksi GitHub Actions -workflowt Android/Kotlin-lahdekoodin sijaan.
          languages: actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
